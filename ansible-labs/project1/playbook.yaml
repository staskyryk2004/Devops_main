- name: Configure Database Node (Node B)
  hosts: db
  become: true
  vars:
    db_name: wordpress_db
    db_user: wordpress_user
    db_pass: SecretPassword123!
    web_ip: "192.168.101.30"

  tasks:
    - name: Install MariaDB / MySQL
      ansible.builtin.apt:
        name:
          - mariadb-server
          - python3-pymysql
        state: present
        update_cache: yes

    - name: Configure MySQL to listen on 192.168.101.20
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: Restart MariaDB

    - name: Start and enable MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: Create WordPress Database
      ansible.mysql.mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create Database User
      ansible.mysql.mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_pass }}"
        host: "{{ web_ip }}"
        priv: "{{ db_name }}.*:ALL"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

  handlers:
    - name: Restart MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted


# ===================================================
# 2. Налаштування Node C (Apache + PHP + WordPress)
# ===================================================
- name: Configure Web Node (Node C)
  hosts: web
  become: true
  vars:
    db_ip: "192.168.101.20"
    db_name: wordpress_db
    db_user: wordpress_user
    db_pass: SecretPassword123!

  tasks:
    - name: Install Apache, PHP and extensions
      ansible.builtin.apt:
        name:
          - apache2
          - php
          - libapache2-mod-php
          - php-mysql
          - curl
          - tar
        state: present
        update_cache: yes

    - name: Download and Extract WordPress
      ansible.builtin.unarchive:
        src: https://wordpress.org/latest.tar.gz
        dest: /var/www/html/
        remote_src: yes
        creates: /var/www/html/wordpress

    - name: Set permissions for WordPress folder
      ansible.builtin.file:
        path: /var/www/html/wordpress
        owner: www-data
        group: www-data
        mode: '0755'
        recurse: yes

    - name: Create wp-config.php from template
      ansible.builtin.copy:
        dest: /var/www/html/wordpress/wp-config.php
        content: |
          <?php
          define( 'DB_NAME', '{{ db_name }}' );
          define( 'DB_USER', '{{ db_user }}' );
          define( 'DB_PASSWORD', '{{ db_pass }}' );
          define( 'DB_HOST', '{{ db_ip }}' );
          define( 'DB_CHARSET', 'utf8' );
          define( 'DB_COLLATE', '' );

          $table_prefix = 'wp_';
          define( 'WP_DEBUG', false );

          if ( ! defined( 'ABSPATH' ) ) {
              define( 'ABSPATH', __DIR__ . '/' );
          }
          require_once ABSPATH . 'wp-settings.php';
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Change Apache VirtualHost document root to WordPress
      ansible.builtin.lineinfile:
        path: /etc/apache2/sites-available/000-default.conf
        regexp: 'DocumentRoot /var/www/html'
        line: 'DocumentRoot /var/www/html/wordpress'
      notify: Restart Apache

    - name: Enable Apache Rewrite module
      ansible.builtin.command: a2enmod rewrite
      notify: Restart Apache

  handlers:
    - name: Restart Apache
      ansible.builtin.service:
        name: apache2
        state: restarted


# ===================================================
# 3. Налаштування Node A (Nginx Reverse Proxy)
# ===================================================
- name: Configure Proxy Node (Node A)
  hosts: proxy
  become: true
  vars:
    node_c_ip: "192.168.102.30"

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Configure Nginx reverse proxy
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80;
              server_name mysite.com;

              location / {
                  proxy_pass http://{{ node_c_ip }}:80;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
